info.title=Infos
privacy.title=Politique de confidentialité de Bookshelf
privacy.date=Mise à jour le 30 octobre 2026
privacy.body=Responsable et contact\nWasiliy Strecker · AppFabrik AI\nLudwigstrasse 23, 86152 Augsbourg, Allemagne\nConfidentialité : contact@appfabrik-ai.de\nAssistance : support@appfabrik-ai.de\n\nFinalités et données enregistrées\nBookshelf gère votre collection personnelle de livres. L’application enregistre localement les titres, auteurs, emplacements, notes et identifiants internes des entrées, ainsi que votre choix de langue, par défaut dans le profil utilisateur de votre ordinateur. Ces champs peuvent contenir des données personnelles si vous les saisissez. Le traitement sert uniquement aux fonctions que vous demandez pour gérer, rechercher, exporter et importer votre collection.\n\nTraitement local\nL’application ne nécessite ni compte ni serveur. Elle ne transmet pas votre collection ni votre choix de langue au développeur ou à d’autres destinataires. Elle ne contient ni publicité, ni télémétrie, ni analyse d’utilisation, ni synchronisation cloud intégrée. Cette politique fait partie de l’application et reste consultable sans connexion Internet. Bookshelf ne chiffre pas lui-même la collection enregistrée ni les fichiers JSON exportés. Leur protection dépend aussi de votre compte utilisateur, des droits d’accès et du chiffrement du disque éventuellement activé.\n\nImportation, exportation et sauvegardes\nLors d’un import, l’application lit localement le fichier JSON choisi. Un export contient tous les livres enregistrés et leurs quatre champs de texte. Il ne contient ni les identifiants internes ni le choix de langue. Vous choisissez l’emplacement et un éventuel partage. Les fichiers exportés sont des copies indépendantes, qui ne sont ni actualisées ni supprimées lorsque vous modifiez ensuite les données de l’application. Si vous utilisez un dossier synchronisé, un lecteur réseau ou un service de sauvegarde, ce service peut traiter ou transmettre les fichiers en dehors de l’application. Ses paramètres et conditions de confidentialité s’appliquent. Bookshelf ne contrôle pas ces services.\n\nConservation et suppression\nL’application conserve votre collection jusqu’à la suppression des entrées ou des données enregistrées de l’application. Vous pouvez consulter, modifier et supprimer les entrées dans l’application. Pour supprimer toute la collection locale et le choix de langue, fermez l’application et supprimez son dossier de données. Les emplacements sont décrits dans les instructions fournies. Les exports et autres sauvegardes doivent être supprimés séparément à leurs emplacements respectifs. Supprimer une entrée ne garantit pas l’effacement sécurisé de tous les anciens contenus des fichiers. Ne supposez pas qu’une désinstallation supprime toutes les données et copies externes.\n\nContact et assistance\nSi vous nous envoyez volontairement un e-mail, nous traitons votre adresse e-mail, le message et ses pièces jointes pour répondre à votre demande. Votre collection locale n’est pas jointe automatiquement. La base juridique est l’article 6, paragraphe 1, point b du RGPD pour les demandes liées à un contrat. Pour les autres demandes, il s’agit de notre intérêt légitime à répondre aux sollicitations selon l’article 6, paragraphe 1, point f du RGPD. Nous conservons la correspondance uniquement pendant la durée nécessaire au traitement et aux obligations légales de conservation.\n\nVos droits et autres fournisseurs\nSelon les dispositions applicables, vous disposez des droits d’accès, de rectification, d’effacement, de limitation du traitement, de portabilité et d’opposition, ainsi que du droit de déposer une réclamation auprès d’une autorité de protection des données. Utilisez le contact de confidentialité ci-dessus. Le développeur n’a pas accès aux collections stockées uniquement sur votre ordinateur. Lorsque vous obtenez ou mettez à jour l’application via Apple App Store, Microsoft Store ou GitHub, ces fournisseurs peuvent traiter des données de manière indépendante selon leurs propres conditions. Cette politique décrit le traitement de Bookshelf et sera actualisée si celui-ci change.

