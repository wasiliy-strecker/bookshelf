info.title=Info
privacy.title=Política de privacidad de Bookshelf by Appfabrik
privacy.date=Actualizada el 30 de octubre de 2026
privacy.body=Responsable y contacto\nWasiliy Strecker · AppFabrik AI\nLudwigstrasse 23, 86152 Augsburgo, Alemania\nPrivacidad: contact@appfabrik-ai.de\nSoporte: support@appfabrik-ai.de\n\nFinalidad y datos guardados\nBookshelf by Appfabrik organiza tu colección personal de libros. La aplicación guarda títulos, autores, ubicaciones, notas e identificadores internos de los registros, junto con tu preferencia de idioma, de forma local, de manera predeterminada, en el perfil de usuario de tu ordenador. Estos campos pueden contener datos personales si los introduces. El tratamiento sirve únicamente para las funciones que solicitas al gestionar, buscar, exportar e importar tu colección.\n\nTratamiento local\nLa aplicación no necesita una cuenta ni un servidor. No transmite tu colección ni la preferencia de idioma al desarrollador ni a otros destinatarios. No incluye publicidad, telemetría, análisis de uso ni sincronización propia en la nube. Esta política forma parte de la aplicación y puede leerse sin conexión a Internet. Bookshelf by Appfabrik no cifra por sí mismo la colección guardada ni los archivos JSON exportados. Su protección también depende de tu cuenta de usuario, los permisos de acceso y el cifrado de disco que hayas activado.\n\nImportación, exportación y copias de seguridad\nAl importar, la aplicación lee localmente el archivo JSON que seleccionas. La exportación incluye todos los libros guardados y los cuatro campos de texto. No incluye los identificadores internos ni la preferencia de idioma. Tú eliges dónde guardarla y si la compartes. Los archivos exportados son copias independientes y no se actualizan ni se eliminan cuando cambias datos en la aplicación. Si utilizas una carpeta sincronizada, una unidad de red o un servicio de copias de seguridad, ese servicio puede tratar o transferir los archivos fuera de la aplicación. Se aplican sus ajustes y condiciones de privacidad. Bookshelf by Appfabrik no controla estos servicios.\n\nConservación y eliminación\nLa aplicación conserva tu colección hasta que elimines entradas o los datos guardados de la aplicación. Puedes consultar, editar y eliminar entradas en la aplicación. Para eliminar toda la colección local y la preferencia de idioma, cierra la aplicación y elimina su carpeta de datos. Las ubicaciones se describen en las instrucciones incluidas. Los archivos exportados y otras copias deben eliminarse por separado de sus respectivas ubicaciones. Eliminar una entrada no garantiza el borrado seguro de todos los contenidos anteriores de los archivos. No debes asumir que desinstalar la aplicación elimina todos sus datos y las copias externas.\n\nContacto y soporte\nSi nos envías voluntariamente un correo, tratamos tu dirección de correo electrónico, el mensaje y sus adjuntos para atender la consulta. Tu colección local no se adjunta automáticamente. La base jurídica para consultas relacionadas con un contrato es el artículo 6.1.b del RGPD. Para otras consultas es nuestro interés legítimo en responder, conforme al artículo 6.1.f del RGPD. Conservamos la correspondencia solo durante el tiempo necesario para atender la consulta y cumplir las obligaciones legales de conservación.\n\nTus derechos y otros proveedores\nCuando corresponda, tienes derecho de acceso, rectificación, supresión, limitación del tratamiento, portabilidad y oposición, así como a presentar una reclamación ante una autoridad de protección de datos. Puedes utilizar el contacto de privacidad indicado arriba. El desarrollador no tiene acceso a las colecciones que solo están en tu ordenador. Al obtener o actualizar la aplicación mediante Apple App Store, Microsoft Store o GitHub, estos proveedores pueden tratar datos de forma independiente según sus propias condiciones. Esta política describe el tratamiento de Bookshelf by Appfabrik y se actualizará cuando cambie dicho tratamiento.

