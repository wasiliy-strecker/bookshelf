info.title=Info
privacy.title=Informativa sulla privacy di Bookshelf
privacy.date=Aggiornata il 30 ottobre 2026
privacy.body=Titolare e contatti\nWasiliy Strecker · AppFabrik AI\nLudwigstrasse 23, 86152 Augusta, Germania\nPrivacy: contact@appfabrik-ai.de\nAssistenza: support@appfabrik-ai.de\n\nFinalità e dati salvati\nBookshelf gestisce la tua raccolta personale di libri. L’app salva titoli, autori, posizioni, note e identificativi interni delle voci, insieme alla preferenza di lingua, per impostazione predefinita localmente nel profilo utente del computer. Questi campi possono contenere dati personali se li inserisci. Il trattamento serve esclusivamente alle funzioni richieste per gestire, cercare, esportare e importare la raccolta.\n\nTrattamento locale\nL’app non richiede un account o un server. Non trasmette la raccolta né la preferenza di lingua allo sviluppatore o ad altri destinatari. Non contiene pubblicità, telemetria, analisi dell’utilizzo o sincronizzazione cloud propria. Questa informativa è inclusa nell’app e si può leggere senza connessione Internet. Bookshelf non cifra autonomamente la raccolta salvata né i file JSON esportati. La protezione dipende anche dall’account utente, dai permessi di accesso e dall’eventuale cifratura del disco attivata.\n\nImportazione, esportazione e backup\nDurante l’importazione, l’app legge localmente il file JSON selezionato. L’esportazione include tutti i libri salvati e i quattro campi di testo. Non include gli identificativi interni né la preferenza di lingua. Scegli tu dove salvare il file e se condividerlo. I file esportati sono copie indipendenti e non vengono aggiornati o eliminati quando modifichi i dati nell’app. Se utilizzi una cartella sincronizzata, un’unità di rete o un servizio di backup, tale servizio può trattare o trasferire i file al di fuori dell’app. Si applicano le sue impostazioni e condizioni sulla privacy. Bookshelf non controlla questi servizi.\n\nConservazione ed eliminazione\nL’app conserva la raccolta fino a quando elimini le voci o i dati salvati dell’app. Puoi visualizzare, modificare ed eliminare le voci nell’app. Per rimuovere tutta la raccolta locale e la preferenza di lingua, chiudi l’app ed elimina la sua cartella dati. I percorsi sono descritti nelle istruzioni incluse. I file esportati e gli altri backup devono essere eliminati separatamente dai rispettivi percorsi. L’eliminazione di una voce non garantisce la cancellazione sicura di tutti i precedenti contenuti dei file. Non presumere che la disinstallazione elimini tutti i dati dell’app e le copie esterne.\n\nContatto e assistenza\nSe ci invii volontariamente un’e-mail, trattiamo il tuo indirizzo e-mail, il messaggio e gli allegati per rispondere alla richiesta. La raccolta locale non viene allegata automaticamente. La base giuridica per le richieste relative a un contratto è l’articolo 6, paragrafo 1, lettera b del GDPR. Per le altre richieste è il nostro legittimo interesse a rispondere, ai sensi dell’articolo 6, paragrafo 1, lettera f del GDPR. Conserviamo la corrispondenza solo per il tempo necessario a gestire la richiesta e adempiere agli obblighi legali di conservazione.\n\nI tuoi diritti e altri fornitori\nOve applicabili, hai diritto di accesso, rettifica, cancellazione, limitazione del trattamento, portabilità e opposizione, oltre al diritto di presentare un reclamo a un’autorità di protezione dei dati. Puoi utilizzare il contatto privacy riportato sopra. Lo sviluppatore non può accedere alle raccolte presenti soltanto sul tuo computer. Quando ottieni o aggiorni l’app tramite Apple App Store, Microsoft Store o GitHub, questi fornitori possono trattare dati autonomamente secondo le proprie condizioni. Questa informativa descrive il trattamento di Bookshelf e sarà aggiornata se tale trattamento cambia.

