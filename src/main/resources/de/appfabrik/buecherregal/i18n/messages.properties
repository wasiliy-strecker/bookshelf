privacy.title=Privacy policy for BücherRegal
privacy.date=Last updated: October 30, 2026
privacy.body=Controller and contact\nWasiliy Strecker · AppFabrik AI\nLudwigstrasse 23, 86152 Augsburg, Germany\nPrivacy: contact@appfabrik-ai.de\nSupport: support@appfabrik-ai.de\n\nPurpose and stored data\nBücherRegal manages your personal book collection. The app stores titles, authors, storage locations, notes and internal record identifiers, together with your language preference, locally in your computer's user profile by default. These entries may contain personal information if you enter it yourself. Processing serves only the functions you request to manage, search, export and import your collection.\n\nLocal processing\nThe app requires no account or server. It does not transmit your collection or language preference to the developer or other recipients. It contains no advertising, telemetry, usage analytics or built-in cloud synchronization. This privacy policy is included in the app and can be read without an internet connection. BücherRegal does not itself encrypt its stored collection or exported JSON files. Protection also depends on your user account, access permissions and any disk encryption you have enabled.\n\nImport, export and backups\nWhen importing, the app reads the JSON file you select locally. An export contains every saved book and all four text fields. It contains neither internal record identifiers nor the language preference. You choose where to save it and whether to share it. Exported files are independent copies and are not updated or deleted when you later change data in the app. If you use a synchronized folder, network drive or backup service, that service may process or transfer files outside the app. The provider's settings and privacy terms apply. BücherRegal does not control these services.\n\nRetention and deletion\nThe app retains your collection until you delete entries or remove the stored app data. You can view, edit and delete entries in the app. To remove the entire local collection and language preference, close the app and remove its data folder. Storage locations are described in the included instructions. Export files and other backups must be deleted separately from their respective locations. Deleting an entry does not guarantee secure erasure of all previous file contents. Do not rely on uninstalling the app to remove all app data and external copies.\n\nContact and support\nIf you voluntarily send us an email, we process your email address, message and attachments to handle your request. Your locally stored collection is not attached automatically. The legal basis for contract-related requests is Article 6(1)(b) GDPR. For other requests it is our legitimate interest in responding to inquiries under Article 6(1)(f) GDPR. We retain correspondence only as long as necessary to handle the request and meet statutory retention obligations.\n\nYour rights and other providers\nWhere applicable, you have rights of access, rectification, erasure, restriction of processing, data portability and objection, and the right to lodge a complaint with a data protection supervisory authority. Use the privacy contact above to exercise these rights. The developer has no access to collections stored only on your computer. When you obtain or update the app through Microsoft Store or GitHub, these providers may process data independently under their own privacy terms. This policy describes processing by BücherRegal and will be updated when that processing changes.
