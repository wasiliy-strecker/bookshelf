info.title=Info
privacy.title=Política de privacidade do Bookshelf
privacy.date=Atualizada em 30 de outubro de 2026
privacy.body=Responsável e contato\nWasiliy Strecker · AppFabrik AI\nLudwigstrasse 23, 86152 Augsburg, Alemanha\nPrivacidade: contact@appfabrik-ai.de\nSuporte: support@appfabrik-ai.de\n\nFinalidade e dados salvos\nO Bookshelf organiza sua coleção pessoal de livros. O aplicativo salva títulos, autores, locais de armazenamento, anotações e identificadores internos dos registros, junto com sua preferência de idioma, por padrão localmente no perfil de usuário do computador. Esses campos podem conter dados pessoais se você os inserir. O tratamento serve somente às funções solicitadas para gerenciar, buscar, exportar e importar sua coleção.\n\nTratamento local\nO aplicativo não exige conta nem servidor. Ele não transmite sua coleção ou preferência de idioma ao desenvolvedor ou a outros destinatários. Não contém publicidade, telemetria, análise de uso nem sincronização própria com a nuvem. Esta política faz parte do aplicativo e pode ser lida sem conexão com a Internet. O Bookshelf não criptografa por conta própria a coleção salva nem os arquivos JSON exportados. A proteção também depende da sua conta de usuário, das permissões de acesso e de eventual criptografia de disco ativada.\n\nImportação, exportação e backups\nAo importar, o aplicativo lê localmente o arquivo JSON selecionado. Uma exportação contém todos os livros salvos e os quatro campos de texto. Não contém os identificadores internos nem a preferência de idioma. Você escolhe onde salvar e se deseja compartilhar o arquivo. Os arquivos exportados são cópias independentes e não são atualizados nem excluídos quando você altera dados no aplicativo. Se usar uma pasta sincronizada, unidade de rede ou serviço de backup, esse serviço poderá tratar ou transferir os arquivos fora do aplicativo. Aplicam-se as configurações e condições de privacidade do provedor. O Bookshelf não controla esses serviços.\n\nRetenção e exclusão\nO aplicativo mantém sua coleção até você excluir registros ou remover os dados salvos do aplicativo. Você pode consultar, editar e excluir registros no aplicativo. Para remover toda a coleção local e a preferência de idioma, feche o aplicativo e remova sua pasta de dados. Os locais estão descritos nas instruções incluídas. Arquivos exportados e outros backups devem ser excluídos separadamente dos respectivos locais. Excluir um registro não garante a eliminação segura de todo o conteúdo anterior dos arquivos. Não presuma que a desinstalação remova todos os dados do aplicativo e as cópias externas.\n\nContato e suporte\nSe você nos enviar voluntariamente um e-mail, trataremos seu endereço de e-mail, a mensagem e os anexos para atender à solicitação. Sua coleção local não será anexada automaticamente. Para solicitações relacionadas a um contrato, a base legal é o artigo 6(1)(b) do RGPD europeu. Para outras solicitações, é nosso interesse legítimo em responder a consultas, conforme o artigo 6(1)(f) do RGPD. Mantemos a correspondência apenas pelo tempo necessário para atender à solicitação e cumprir obrigações legais de retenção.\n\nSeus direitos e outros provedores\nConforme a legislação aplicável, você tem direitos de acesso, retificação, exclusão, limitação do tratamento, portabilidade e oposição, além do direito de apresentar uma reclamação à autoridade de proteção de dados competente. Use o contato de privacidade acima. O desenvolvedor não tem acesso às coleções armazenadas somente no seu computador. Ao obter ou atualizar o aplicativo pelo Apple App Store, Microsoft Store ou GitHub, esses provedores poderão tratar dados de forma independente, conforme suas próprias condições. Esta política descreve o tratamento pelo Bookshelf e será atualizada quando esse tratamento mudar.

